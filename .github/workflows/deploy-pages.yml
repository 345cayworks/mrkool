name: Publish to GitHub Pages

# Pages is configured branch-based (source: gh-pages). This workflow keeps
# gh-pages in sync with the development branch; GitHub deploys it on push.
on:
  push:
    branches: [main, claude/eloquent-galileo-vl6omz]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
